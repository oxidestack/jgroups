# cargo-deny configuration: the licence gate (the `deny` job on both forges).
#
# jgroups is built to become part of a CNCF project, so every crate in its graph must carry a
# licence on the CNCF allowed third-party licence policy
# (https://github.com/cncf/foundation/blob/main/policies-guidance/allowed-third-party-license-policy.md). Anything
# else needs a Governing Board exception (https://exceptions.cncf.io) and is listed below as a named exception, each
# citing the reason. A new crate with any other licence fails `cargo deny check licenses`: it is not
# added (or it gets its own ticket and entry here), and `allow` is never widened to make the gate green. The `allow`
# block is the CNCF allowlist, as the sibling ports' deny.toml carry it.

[graph]
# Every feature, so a dependency behind a non-default feature is still checked.
all-features = true

[advisories]
# RustSec: a vulnerability, an unsound crate, an unmaintained crate or a yanked version fails the gate.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# The CNCF allowlist, exactly. `Apache-2.0 WITH LLVM-exception` is not on it; crates offering it also offer plain
# Apache-2.0 or MIT, which is what they are used under.
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "PostgreSQL",
    "Python-2.0",
    "PSF-2.0",
    "X11",
    "UPL-1.0",
    "0BSD",
    "OpenSSL",
]
# The allowlist is the policy, not the licences the graph happens to use today.
unused-allowed-license = "allow"
confidence-threshold = 0.93

# Each exception names one crate and allows only the licence it needs; the rest of its expression (an `AND`) must still
# be allowlisted. An exception that no longer matches a crate in the graph is reported, and is then deleted here.
#
# unicode-ident (a build-time dependency of proc-macro2 and syn, so of every proc macro crate) is
# `(MIT OR Apache-2.0) AND Unicode-3.0`; the Unicode-3.0 part covers its identifier tables. Unicode-3.0 is not on the
# CNCF allowlist, so it is pending a CNCF exception (checked 2026-11-17), as in the sibling ports.
exceptions = [
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
]
