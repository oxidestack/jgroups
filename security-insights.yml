# OpenSSF Security Insights (https://github.com/ossf/security-insights), schema 2.2.0: what the project says about
# its own security, for tools and people who assess it (CLOMonitor reads it from this path).
header:
  schema-version: 2.2.0
  last-updated: "2026-11-17"
  last-reviewed: "2026-11-17"
  url: https://raw.githubusercontent.com/oxidestack/jgroups/main/security-insights.yml

project:
  name: jgroups
  homepage: https://github.com/oxidestack/jgroups
  administrators:
    - name: Vitaly Kustov
      email: kustov.vitalik@gmail.com
      social: https://github.com/kustov-vitalik
      primary: true
  repositories:
    - name: jgroups
      url: https://github.com/oxidestack/jgroups
      comment: The crate, its recorded vectors and the documentation.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/oxidestack/jgroups/blob/main/SECURITY.md
    contact:
      name: Vitaly Kustov
      email: kustov.vitalik@gmail.com
      social: https://github.com/kustov-vitalik
      primary: true
    comment: >-
      Report a vulnerability through GitHub's private vulnerability reporting, on the repository's Security tab, never
      in a public issue. Fixes go into the latest release.
    in-scope:
      - The crate's own code: protocol messages and frames read from the network.
    out-of-scope:
      - A vulnerability in JGroups itself, which belongs to its maintainers.
  documentation:
    quickstart-guide: https://github.com/oxidestack/jgroups#readme
    detailed-guide: https://docs.rs/jgroups
    code-of-conduct: https://github.com/oxidestack/jgroups/blob/main/CODE_OF_CONDUCT.md
    support-policy: https://github.com/oxidestack/jgroups/blob/main/SECURITY.md#supported-versions

repository:
  url: https://github.com/oxidestack/jgroups
  # repostatus.org: under active development, not yet released.
  status: wip
  accepts-change-request: true
  accepts-automated-change-request: false
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: Vitaly Kustov
      email: kustov.vitalik@gmail.com
      social: https://github.com/kustov-vitalik
      primary: true
  license:
    url: https://github.com/oxidestack/jgroups/blob/main/LICENSE
    expression: Apache-2.0 AND CC-BY-4.0
  documentation:
    contributing-guide: https://github.com/oxidestack/jgroups/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/oxidestack/jgroups/blob/main/GOVERNANCE.md#dependencies
    governance: https://github.com/oxidestack/jgroups/blob/main/GOVERNANCE.md
    review-policy: https://github.com/oxidestack/jgroups/blob/main/GOVERNANCE.md#how-decisions-are-made
    security-policy: https://github.com/oxidestack/jgroups/blob/main/SECURITY.md
  security:
    assessments:
      self:
        comment: No self-assessment has been published yet.
    champions:
      - name: Vitaly Kustov
        email: kustov.vitalik@gmail.com
        social: https://github.com/kustov-vitalik
        primary: true
    tools:
      - name: cargo-deny
        type: SCA
        comment: Licences against the CNCF allowlist, advisories, yanked and unmaintained crates, crate sources.
        rulesets:
          - deny.toml
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
  release:
    # The release pipeline is not in place yet; no release has been made.
    automated-pipeline: false
    distribution-points:
      - uri: https://crates.io/crates/jgroups
        comment: The crate, once released.
      - uri: https://github.com/oxidestack/jgroups/releases
        comment: Each version's notes.
